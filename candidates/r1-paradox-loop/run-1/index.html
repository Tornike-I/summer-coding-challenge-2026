<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paradox Loop</title>
<style>
:root{
  --bg:#0e1116;
  --bg-2:#141922;
  --panel:#1a212c;
  --panel-2:#212a37;
  --line:#2c3644;
  --line-2:#3a4757;
  --text:#e6edf6;
  --muted:#93a2b6;
  --dim:#67768a;

  --you:#4ee6a8;
  --you-dim:#1f6b52;
  --ghost:#ff9a62;

  --ca:#59a8ff;
  --ca-dim:#1d4470;
  --cb:#c08bff;
  --cb-dim:#4a2e73;

  --danger:#ff6b6b;
  --gold:#ffd479;

  --r-s:8px;
  --r-m:14px;
  --r-l:20px;

  --gap:4px;
  --tile:38px;

  --f-xs:11px;
  --f-s:13px;
  --f-m:15px;
  --f-l:20px;
  --f-xl:30px;
  --f-xxl:42px;

  --t-fast:120ms;
  --t-mid:200ms;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% -10%, #1b2430 0%, rgba(27,36,48,0) 60%),
    radial-gradient(700px 500px at 100% 110%, #17222c 0%, rgba(23,34,44,0) 60%),
    var(--bg);
  font-size:var(--f-m);
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

#app{
  height:100vh;
  height:100dvh;
  width:100%;
  max-width:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.screen{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  overflow-y:auto;
}
.screen[hidden]{display:none!important}
[hidden]{display:none!important}

.wrap{width:100%;max-width:760px;padding:16px;margin:0 auto}

/* ---------- typography ---------- */
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.01em;line-height:1.15}
h1{font-size:var(--f-xxl)}
h2{font-size:var(--f-l)}
h3{font-size:var(--f-m)}
p{margin:0}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:var(--f-s)}
.xs{font-size:var(--f-xs)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-c{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0
}

/* ---------- buttons ---------- */
button{
  font:inherit;color:inherit;cursor:pointer;
  border:1px solid var(--line-2);
  background:var(--panel-2);
  border-radius:var(--r-m);
  min-height:44px;
  padding:10px 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background var(--t-fast) ease,border-color var(--t-fast) ease,transform var(--t-fast) ease;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){background:#2a3545;border-color:#4a5a6e}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.btn-primary{
  background:linear-gradient(180deg,#4ee6a8,#2bbf87);
  color:#07231a;border-color:#48d69e;font-weight:650;
}
.btn-primary:hover:not(:disabled){background:linear-gradient(180deg,#6bf0ba,#33d296);border-color:#6bf0ba}
.btn-ghost{background:transparent}
.btn-wide{width:100%}
.btn-s{min-height:44px;padding:8px 14px;font-size:var(--f-s)}

/* ---------- title ---------- */
.title-screen{justify-content:center}
.logo{
  display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:6px;
}
.logo-mark{
  width:84px;height:84px;position:relative;display:grid;place-items:center;
}
.logo-mark .ring{
  position:absolute;inset:0;border-radius:50%;
  border:3px solid var(--ca);opacity:.5;
}
.logo-mark .ring.b{inset:12px;border-color:var(--cb);opacity:.55}
.logo-mark .ring.c{inset:24px;border-color:var(--ghost);opacity:.5}
.logo-mark .core{
  width:20px;height:20px;border-radius:7px;background:var(--you);
  box-shadow:0 0 18px rgba(78,230,168,.65);
}
.hook{color:var(--muted);max-width:34ch;margin:0 auto}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin:22px auto 0}

/* ---------- how to play ---------- */
.steps{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  padding:14px;display:flex;flex-direction:column;gap:10px;
}
.step-n{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line-2);
  font-size:var(--f-xs);color:var(--muted);font-weight:700;
}
.demo{
  display:grid;gap:3px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-m);padding:6px;
}
.demo-cell{
  aspect-ratio:1/1;border-radius:6px;background:#202836;display:grid;place-items:center;position:relative;
}
.demo-cell.w{background:#161c26;border:1px solid #232c39}
.demo-cell.p{background:#1e2b3c}
.dot{width:62%;height:62%;border-radius:8px}
.dot.you{background:var(--you);box-shadow:0 0 10px rgba(78,230,168,.5)}
.dot.gh{background:var(--ghost);opacity:.5;border-radius:50%}
.shape-a{width:52%;height:52%;border-radius:50%;border:2px solid var(--ca);background:rgba(89,168,255,.18)}
.shape-a.on{background:var(--ca);box-shadow:0 0 10px rgba(89,168,255,.6)}
.shape-b{width:46%;height:46%;transform:rotate(45deg);border:2px solid var(--cb);background:rgba(192,139,255,.18)}
.exit-mark{width:58%;height:58%;border-radius:50%;border:2px dashed var(--you);opacity:.9}
.key{
  display:inline-block;border:1px solid var(--line-2);background:var(--panel-2);
  border-radius:6px;padding:1px 7px;font-size:var(--f-xs);color:var(--muted);
}

/* ---------- level select ---------- */
.levels{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.levels{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.levels{grid-template-columns:repeat(3,1fr)}}
.lvl{
  text-align:left;align-items:stretch;justify-content:flex-start;flex-direction:column;gap:4px;
  padding:14px;border-radius:var(--r-l);background:var(--panel);border:1px solid var(--line);
  min-height:96px;
}
.lvl:hover:not(:disabled){background:var(--panel-2)}
.lvl .lvl-top{display:flex;align-items:center;gap:8px;width:100%}
.lvl .num{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line-2);font-size:var(--f-xs);font-weight:700;color:var(--muted)
}
.lvl.done .num{background:var(--you-dim);border-color:var(--you);color:var(--you)}
.lvl .nm{font-weight:600}
.lvl .meta{font-size:var(--f-xs);color:var(--dim)}
.lvl .best{font-size:var(--f-s);color:var(--gold)}
.lvl[disabled]{opacity:.5}
.lock{margin-left:auto;font-size:var(--f-xs);color:var(--dim)}

/* ---------- play screen ---------- */
#s-play{overflow:hidden}
.play-col{
  flex:1 1 auto;min-height:0;width:100%;max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;
}
.statusbar{
  display:flex;gap:6px;align-items:center;flex-wrap:nowrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:6px 8px;overflow:hidden;
}
.chip{
  display:flex;flex-direction:column;line-height:1.1;padding:2px 6px;border-radius:var(--r-s);
  min-width:0;flex:1 1 0;
}
.chip .k{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.chip .v{font-size:var(--f-s);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.warn .v{color:var(--danger)}
.chip.gh .v{color:var(--ghost)}
.statusbar .sep{width:1px;align-self:stretch;background:var(--line);flex:0 0 1px}
.icon-btn{min-height:40px;min-width:44px;padding:6px 10px;border-radius:var(--r-s);flex:0 0 auto}

.boardwrap{
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
}
.board{
  display:grid;gap:var(--gap);
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-m);padding:var(--gap);
  touch-action:none;
}
.tile{
  width:var(--tile);height:var(--tile);border-radius:calc(var(--tile) * .22);
  background:#1c2430;position:relative;display:grid;place-items:center;
  transition:background var(--t-fast) ease,box-shadow var(--t-fast) ease;
}
.tile.wall{background:#11161e;box-shadow:inset 0 0 0 1px #1d2632}
.tile.start{background:#1b2a2a;box-shadow:inset 0 0 0 2px rgba(78,230,168,.35)}
.tile.plate,.tile.exit,.tile.door{background:#1f2836}
.tile.flash{background:#5a2530;box-shadow:inset 0 0 0 2px var(--danger)}

.mark{position:absolute;pointer-events:none}
.plate-a{width:56%;height:56%;border-radius:50%;border:2px solid var(--ca);background:rgba(89,168,255,.12)}
.plate-b{width:50%;height:50%;transform:rotate(45deg);border:2px solid var(--cb);background:rgba(192,139,255,.12)}
.tile.on .plate-a{background:var(--ca);box-shadow:0 0 12px rgba(89,168,255,.7)}
.tile.on .plate-b{background:var(--cb);box-shadow:0 0 12px rgba(192,139,255,.7)}

.door-a,.door-b{
  width:100%;height:100%;border-radius:inherit;display:grid;place-items:center;
}
.door-a{background:repeating-linear-gradient(45deg,rgba(89,168,255,.85) 0 6px,rgba(89,168,255,.55) 6px 12px);box-shadow:inset 0 0 0 2px var(--ca)}
.door-b{background:repeating-linear-gradient(45deg,rgba(192,139,255,.85) 0 6px,rgba(192,139,255,.55) 6px 12px);box-shadow:inset 0 0 0 2px var(--cb)}
.tile.open .door-a,.tile.open .door-b{background:none;opacity:.55}
.tile.open .door-a{box-shadow:inset 0 0 0 2px rgba(89,168,255,.45)}
.tile.open .door-b{box-shadow:inset 0 0 0 2px rgba(192,139,255,.45)}
.door-badge{width:32%;height:32%}
.door-badge.a{border-radius:50%;border:2px solid var(--ca)}
.door-badge.b{transform:rotate(45deg);border:2px solid var(--cb)}
.tile.open .door-badge{opacity:.5}

.exit-ring{
  width:72%;height:72%;border-radius:50%;
  border:2px dashed var(--you);opacity:.85;
}
.tile.exit.shut .exit-ring{border-style:solid;border-color:var(--dim);opacity:.6}
.exit-lock{position:absolute;width:30%;height:30%}
.exit-lock.a{border-radius:50%;border:2px solid var(--ca);background:rgba(89,168,255,.2)}
.exit-lock.b{transform:rotate(45deg);border:2px solid var(--cb);background:rgba(192,139,255,.2)}
.tile.exit.open-x{background:#1d3a30;box-shadow:inset 0 0 0 2px rgba(78,230,168,.45)}

.body{
  position:absolute;width:74%;height:74%;border-radius:calc(var(--tile) * .2);
  display:grid;place-items:center;font-size:calc(var(--tile) * .34);font-weight:700;
}
.body.you{
  background:linear-gradient(180deg,#6ff0bb,#31c78d);
  box-shadow:0 0 14px rgba(78,230,168,.55),inset 0 -2px 0 rgba(0,0,0,.18);
  color:#07281d;
}
.body.gh{
  background:rgba(255,154,98,.42);
  border:2px dashed rgba(255,154,98,.85);
  color:#ffd9c2;
  border-radius:50%;
}
.stackn{
  position:absolute;right:2px;bottom:1px;font-size:calc(var(--tile) * .26);
  color:var(--muted);background:rgba(0,0,0,.45);border-radius:5px;padding:0 3px;line-height:1.2;
}
.pop{animation:pop var(--t-mid) ease}
@keyframes pop{from{transform:scale(.72);opacity:.45}to{transform:scale(1);opacity:1}}

.hintbar{
  font-size:var(--f-s);color:var(--muted);text-align:center;
  min-height:1.4em;padding:0 4px;
}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dpad{
  display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:6px;
}
.dpad button{min-height:44px;min-width:48px;padding:0;border-radius:var(--r-s);font-size:var(--f-m)}
.dpad .up{grid-area:1/2}
.dpad .left{grid-area:2/1}
.dpad .wait{grid-area:2/2;font-size:var(--f-xs)}
.dpad .right{grid-area:2/3}
.dpad .down{grid-area:3/2}
.side{display:grid;grid-template-columns:1fr;gap:6px}
.side button{min-height:44px;padding:6px 12px;font-size:var(--f-s);white-space:nowrap}
.side .rw{border-color:var(--ghost);color:#ffcdae}
.side .rw:hover:not(:disabled){background:#3a2a22;border-color:var(--ghost)}
@media (min-width:560px){
  .dpad{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px)}
  .side{grid-template-columns:repeat(3,auto)}
}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:20;background:rgba(8,11,15,.78);
  display:flex;align-items:center;justify-content:center;padding:16px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.card{
  width:min(420px,100%);background:var(--panel);border:1px solid var(--line-2);
  border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:14px;
  max-height:92vh;overflow-y:auto;
  animation:rise var(--t-mid) ease;
}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;text-align:center}
.sc .k{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.sc .v{font-size:var(--f-l);font-weight:700}
.sc .v.good{color:var(--you)}
.banner{
  border-radius:var(--r-m);padding:10px 12px;font-size:var(--f-s);
  background:rgba(255,212,121,.1);border:1px solid rgba(255,212,121,.35);color:var(--gold);
}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:var(--f-xs);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:5px;display:inline-block}
.sw.you{background:var(--you)}
.sw.gh{background:rgba(255,154,98,.5);border:1px dashed var(--ghost);border-radius:50%}
.sw.a{border:2px solid var(--ca);border-radius:50%;background:rgba(89,168,255,.25)}
.sw.b{border:2px solid var(--cb);background:rgba(192,139,255,.25);transform:rotate(45deg);width:12px;height:12px}

.topbar{
  display:flex;align-items:center;gap:10px;width:100%;max-width:760px;
  padding:10px 16px 0;margin:0 auto;
}
.topbar h2{flex:1 1 auto}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.001ms!important;animation-iteration-count:1!important;
    transition-duration:0.001ms!important;scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
